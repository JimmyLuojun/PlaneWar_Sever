# /Users/junluo/Desktop/PlaneWar_Server/pyproject.toml

[tool.poetry]
name = "planewar-server" # Renamed slightly to reflect client+server nature
version = "0.1.0"
description = "Networked PlaneWar game with Flask server and leaderboard" # Updated description
authors = ["Jimmy Luojun <15828061015@163.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/JimmyLuojun/PlaneWar" # Keep or update if repo location changed
# homepage = "https://github.com/JimmyLuojun/PlaneWar" # Optional
keywords = ["pygame", "game", "shooter", "arcade", "flask", "networked"] # Added server keywords

# --- Crucial: Define the packages within this project ---
# Tells Poetry where to find the Python code relative to this file
packages = [
    { include = "plane_war_server", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.10" # Keep your original Python requirement

# == Client Dependencies ==
pygame = "^2.5.2"   # Keep your specific pygame version
requests = "^2.31.0" # Added: For client to call server API

# == Server Dependencies ==
flask = "^3.0.3"
flask-sqlalchemy = "^3.1.1"
flask-migrate = "^4.0.7"
flask-login = "^0.6.3"
flask-bcrypt = "^1.0.1"
python-dotenv = "^1.0.1"
gunicorn = "^22.0.0"      # WSGI server for deployment

# == Optional Database Drivers (add as needed via --extras) ==
psycopg2-binary = { version = "^2.9.9", optional = true } # For PostgreSQL
mysqlclient = { version = "^2.2.0", optional = true }   # For MySQL

# --- Optional Extras (for installing DB drivers) ---
[tool.poetry.extras]
postgres = ["psycopg2-binary"]
mysql = ["mysqlclient"]

# --- Development Dependencies ---
[tool.poetry.group.dev.dependencies]
ruff = "^0.4.4"
basedpyright = "^1.18.0"
pytest = "^8.3.5"
pytest-mock = "^3.14.0"
requests-mock = "^1.12.1"
pytest-cov = "^7.0.0"
[tool.poetry.scripts]
run-planewar-game = "plane_war_server.game.main:main"
run-planewar-server = "plane_war_server.main:run_dev_server"

# --- Pytest Configuration ---
[tool.pytest.ini_options]
# Automatically run with coverage
addopts = ["-v", "--cov-report=term-missing", "--cov-report=html"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# --- Coverage Configuration ---
[tool.coverage.run]
source = ["game", "src/plane_war_server"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# --- Ruff Configuration ---
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Basedpyright Configuration ---
[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/node_modules", ".venv"]

# --- Build System Configuration ---
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
